name: Install

on:
  - push
  - pull_request

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install python-evdev
        run: |
          uv venv -p ${{ matrix.python-version }}
          uv pip install -v .
          uv run python -c "import evdev.ecodes; print(evdev.ecodes)"
